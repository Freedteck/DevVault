name: AI Agent — Answer Questions

on:
  # Triggered immediately when a question is posted (via repository_dispatch from frontend)
  repository_dispatch:
    types: [ai-agent-question]

  # Fallback schedule: catches any question the dispatch might have missed
  schedule:
    - cron: "*/15 * * * *" # Every 15 minutes

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      question_id:
        description: "Specific questionId to process (leave blank to scan recent)"
        required: false

jobs:
  answer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run AI Agent
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.AGENT_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          QUESTION_TOPIC_ID: ${{ secrets.QUESTION_TOPIC_ID }}
          ANSWER_TOPIC_ID: ${{ secrets.ANSWER_TOPIC_ID }}
          HOL_OUTBOUND_TOPIC_ID: ${{ secrets.HOL_OUTBOUND_TOPIC_ID }}
          HOL_INBOUND_TOPIC_ID: ${{ secrets.HOL_INBOUND_TOPIC_ID }}
          # Set from dispatch payload or manual input
          QUESTION_ID: ${{ github.event.client_payload.question_id || github.event.inputs.question_id }}
        run: node scripts/ai-agent-runner.mjs
