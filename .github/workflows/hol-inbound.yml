name: HOL Agent — Handle Inbound Messages

on:
  # Poll every 5 minutes for incoming messages
  schedule:
    - cron: "*/5 * * * *"

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  handle-inbound:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      # Restore cache of last processed sequence number
      - name: Restore inbound cursor
        uses: actions/cache@v4
        with:
          path: .hol-cursor.json
          key: hol-inbound-cursor-v1

      - name: Handle HOL Inbound Messages
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.HEDERA_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.HEDERA_PRIVATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          QUESTION_TOPIC_ID: ${{ secrets.QUESTION_TOPIC_ID }}
          ANSWER_TOPIC_ID: ${{ secrets.ANSWER_TOPIC_ID }}
          HOL_INBOUND_TOPIC_ID: ${{ secrets.HOL_INBOUND_TOPIC_ID }}
          HOL_OUTBOUND_TOPIC_ID: ${{ secrets.HOL_OUTBOUND_TOPIC_ID }}
        run: node scripts/hol-inbound-handler.mjs

      # Save updated cursor so next run only processes new messages
      - name: Save inbound cursor
        uses: actions/cache@v4
        with:
          path: .hol-cursor.json
          key: hol-inbound-cursor-v1
