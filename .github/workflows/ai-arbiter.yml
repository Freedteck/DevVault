name: AI Arbiter — Auto-release Stale Bounties

on:
  # Runs daily — checks all bounty questions older than 7 days with no accepted answer
  schedule:
    - cron: "0 2 * * *" # 2am UTC daily

  # Manual trigger for testing / early arbitration
  workflow_dispatch:

jobs:
  arbitrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run AI Arbiter
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.ARBITER_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.ARBITER_PRIVATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          QUESTION_TOPIC_ID: ${{ secrets.QUESTION_TOPIC_ID }}
          ANSWER_TOPIC_ID: ${{ secrets.ANSWER_TOPIC_ID }}
          ACCEPTANCE_TOPIC_ID: ${{ secrets.ACCEPTANCE_TOPIC_ID }}
          ESCROW_CONTRACT_ID: ${{ secrets.ESCROW_CONTRACT_ID }}
        run: node scripts/ai-arbiter-runner.mjs
