<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Shield base -->
  <path
    d="M60 10 L95 25 L95 55 Q95 85 60 105 Q25 85 25 55 L25 25 Z"
    fill="url(#logoGradient)"
    stroke="#1e40af"
    stroke-width="2"
  />

  <!-- Inner shield highlight -->
  <path
    d="M60 15 L88 28 L88 52 Q88 78 60 95 Q32 78 32 52 L32 28 Z"
    fill="none"
    stroke="url(#accentGradient)"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- Code brackets -->
  <g fill="white" font-family="monospace" font-size="14" font-weight="bold">
    <text x="35" y="59" text-anchor="middle">{</text>
    <text x="85" y="59" text-anchor="middle">}</text>
  </g>

  <!-- Central 'DV' -->
  <g fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    <text x="60" y="60" text-anchor="middle" letter-spacing="1px">DV</text>
  </g>

  <!-- Circuit-like decorative elements -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M45 20 Q60 15 75 20" />
    <path d="M45 80 Q60 85 75 80" />
    <line x1="35" y1="35" x2="40" y2="35" />
    <line x1="80" y1="35" x2="85" y2="35" />
    <line x1="35" y1="55" x2="40" y2="55" />
    <line x1="80" y1="55" x2="85" y2="55" />
  </g>

  <!-- Small accent dots -->
  <circle cx="50" cy="30" r="1.5" fill="url(#accentGradient)" opacity="0.7" />
  <circle cx="70" cy="30" r="1.5" fill="url(#accentGradient)" opacity="0.7" />
  <circle cx="50" cy="70" r="1.5" fill="url(#accentGradient)" opacity="0.7" />
  <circle cx="70" cy="70" r="1.5" fill="url(#accentGradient)" opacity="0.7" />
</svg>