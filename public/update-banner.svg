<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b17"/>
      <stop offset="100%" stop-color="#0d1224"/>
    </linearGradient>

    <!-- Glow blob - top left -->
    <radialGradient id="glow1" cx="12%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow blob - right side -->
    <radialGradient id="glow2" cx="85%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="rgba(255,255,255,0.015)"/>
    </pattern>

    <!-- Grid dots pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.8" fill="rgba(148,163,184,0.12)"/>
      <circle cx="32" cy="0" r="0.8" fill="rgba(148,163,184,0.12)"/>
      <circle cx="0" cy="32" r="0.8" fill="rgba(148,163,184,0.12)"/>
      <circle cx="32" cy="32" r="0.8" fill="rgba(148,163,184,0.12)"/>
    </pattern>

    <!-- Accent bar gradient horizontal -->
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Text fade gradient (right edge) -->
    <linearGradient id="textFade" x1="70%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="textMask">
      <rect width="800" height="200" fill="url(#textFade)"/>
    </mask>

    <!-- Code token glow -->
    <filter id="tokenGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Dot grid -->
  <rect width="800" height="200" fill="url(#dots)"/>

  <!-- Scanlines overlay -->
  <rect width="800" height="200" fill="url(#scanlines)"/>

  <!-- Glow blobs -->
  <rect width="800" height="200" fill="url(#glow1)"/>
  <rect width="800" height="200" fill="url(#glow2)"/>

  <!-- Horizontal accent bar at very top -->
  <rect x="0" y="0" width="560" height="2" fill="url(#accentBar)" rx="1"/>

  <!-- Decorative vertical accent bar left side -->
  <rect x="0" y="0" width="3" height="200" fill="url(#accentBar)"/>

  <!-- ── Decorative floating code tokens ── -->

  <!-- Left column code decorations -->
  <g filter="url(#tokenGlow)" opacity="0.55">
    <!-- Terminal prompt block -->
    <rect x="36" y="62" width="6" height="14" rx="1" fill="#4f46e5"/>
    <text x="50" y="74" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#818cf8">function</text>
    <text x="123" y="74" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#e2e8f0">&#160;resolve(</text>
    <text x="213" y="74" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#f472b6">answer</text>
    <text x="263" y="74" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#e2e8f0">) {</text>

    <!-- Second code line -->
    <text x="50" y="96" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94a3b8">&#160;&#160;return</text>
    <text x="115" y="96" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34d399">&#160;hcs.post(</text>
    <text x="204" y="96" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#fb923c">topicId</text>
    <text x="260" y="96" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94a3b8">);</text>

    <!-- Third line closing brace -->
    <text x="50" y="116" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#e2e8f0">}</text>
  </g>

  <!-- ── "DEVVAULT" watermark wordmark (large, faint, right side) ── -->
  <text
    x="490" y="150"
    font-family="JetBrains Mono, Consolas, monospace"
    font-size="90"
    font-weight="900"
    letter-spacing="-4"
    fill="rgba(99,102,241,0.06)"
    text-anchor="middle"
  >VAULT</text>

  <!-- ── Main label pill ── -->
  <rect x="35" y="130" width="126" height="28" rx="14" fill="rgba(79,70,229,0.2)" stroke="rgba(99,102,241,0.45)" stroke-width="1"/>
  <text x="98" y="149" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#a5b4fc">DEV UPDATES</text>

  <!-- ── Small decorative dots row ── -->
  <g opacity="0.7">
    <circle cx="36" cy="168" r="2.5" fill="#4f46e5"/>
    <circle cx="47" cy="168" r="2.5" fill="#7c3aed" opacity="0.6"/>
    <circle cx="58" cy="168" r="2.5" fill="#4f46e5" opacity="0.3"/>
  </g>

  <!-- ── Binary / hex decoration top right ── -->
  <g opacity="0.12" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#94a3b8">
    <text x="620" y="30">0x4846 0x4353</text>
    <text x="650" y="46">10 • 01 • 11</text>
    <text x="630" y="62">0xDEAD 0xBEEF</text>
    <text x="648" y="78">HCS-10 • v2</text>
  </g>

  <!-- ── Chain links SVG decoration (bottom right corner) ── -->
  <g opacity="0.18" stroke="rgba(99,102,241,0.8)" stroke-width="1.5" fill="none">
    <circle cx="700" cy="150" r="14"/>
    <circle cx="727" cy="150" r="14"/>
    <circle cx="754" cy="150" r="14"/>
  </g>

  <!-- ── Subtle horizontal divider line ── -->
  <line x1="35" y1="125" x2="300" y2="125" stroke="rgba(99,102,241,0.2)" stroke-width="0.5"/>
</svg>
